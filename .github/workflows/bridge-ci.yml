name: DEEVO Dev Bridge CI

on:
  push:
    branches: [main]
    paths:
      - 'deevo-dev-bridge/**'
      - '.vscode/mcp.json'
      - '.github/workflows/bridge-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deevo-dev-bridge/**'
      - '.vscode/mcp.json'
      - '.github/workflows/bridge-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deevo-dev-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deevo-dev-bridge/package.json
      - run: npm install
      - run: npm run build
